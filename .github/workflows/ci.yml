name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run lint

      - run: bun run check

      # Playwright-driven tests (the vitest browser project and the e2e suite)
      # are skipped for now; only the plain Node vitest project runs here.
      - name: Unit tests
        run: bunx vitest run --project server

      - run: bun run build
