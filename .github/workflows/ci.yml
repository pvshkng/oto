name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run lint

      - run: bun run check

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - run: bun run test:unit -- --run

      - run: bun run build

      - run: bun run test:e2e
